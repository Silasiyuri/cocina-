<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2NIGHT - Konyhai Panel (Nagy Betűk & Sziréna)</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 25px; }
        h1 { margin: 0; color: #3ecf8e; font-size: 2.2rem; display: flex; align-items: center; gap: 15px; }
        .grid-rendelesek { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }
        
        /* TARJETAS GIGANTES DE PANTALLA */
        .kartya { background: #1e293b; border: 1px solid #475569; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .kartya-fejlec { display: flex; justify-content: space-between; border-bottom: 2px dashed #475569; padding-bottom: 12px; margin-bottom: 15px; }
        .id-szam { font-weight: bold; color: #ffffff; font-size: 1.6rem; }
        .idopont { color: #94a3b8; font-size: 1.1rem; font-weight: bold; }
        
        .cim { font-weight: bold; color: #d6af37; margin-bottom: 15px; font-size: 1.4rem; line-height: 1.4; }
        .tetelek { white-space: pre-wrap; font-size: 1.8rem; font-weight: bold; background: #0f172a; padding: 15px; border-radius: 6px; border-left: 6px solid #3ecf8e; margin-bottom: 15px; color: #ffffff; line-height: 1.5; }
        .megjegyzes { font-style: italic; color: #cbd5e1; font-size: 1.2rem; margin-bottom: 20px; background: rgba(234,179,8,0.1); padding: 10px; border-radius: 4px; border-left: 4px solid #eab308; }
        .ar-kiiras { color: #3ecf8e; font-weight: bold; margin-top: 5px; font-size: 1.3rem; }

        /* EFECTO VISUAL DE SIRENA ACTIVA */
        .kartya.szirénázik { border: 3px solid #ef4444; animation: riasztoKartya 0.6s infinite alternate; }
        @keyframes riasztoKartya {
            0% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.2); background: #1e293b; }
            100% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.9); background: #3b111a; }
        }

        .gombok { display: flex; gap: 15px; }
        button { flex: 1; padding: 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.1rem; text-transform: uppercase; }
        .btn-nyomtatas { background: #3b82f6; color: white; }
        .btn-kesz { background: #3ecf8e; color: white; }
        
        .btn-audio-unblock { background: #eab308; color: #000; padding: 12px 24px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; border: none; }
        .btn-audio-unblock.active { background: #3ecf8e; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>
            👨‍🍳 Konyhai Monitor 
            <button id="btnAudioDesbloqueo" class="btn-audio-unblock" onclick="desbloquearSirenaMovel()">⚠️ HANG ÉS NYOMTATÁS</button>
        </h1>
        <div id="kapcsolat-statusz" style="color: #64748b; font-size: 1.1rem; font-weight: bold;">Kapcsolódás...</div>
    </header>

    <audio id="audio-riaszto" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==" preload="auto"></audio>

    <div class="grid-rendelesek" id="kont-rendelesek"></div>
    <div id="nyomtatas-terulet-escondido" style="display:none;"></div>
    <script>
        const ID_PROYECTO = "kpxcpkzmquqyduadnahz";
        const SUPABASE_KEY = "sb_publishable_XMm1hlrSBzm8iyLWM1iqCA__qBE79B3";
        let utolsoRendelesDarab = 0;
        let chipSonidoHardware = null;
        
        let bucleSirenaEmergencia = null;
        let alarmasActivasMapeadas = new Set(); 
        let tabletAutorizadaFisicamente = false;

        window.desbloquearSirenaMovel = function() {
            const btn = document.getElementById('btnAudioDesbloqueo');
            tabletAutorizadaFisicamente = true;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                chipSonidoHardware = new AudioContext();
                if (chipSonidoHardware.state === 'suspended') chipSonidoHardware.resume();
                ejecutarTonoSirenaFisico(440, 0.1);
                if (btn) {
                    btn.innerText = "🟢 MONITOR AKTÍV";
                    btn.className = "btn-audio-unblock active";
                }
            } catch (e) {
                alert("Hiba történt a hangmotor indításakor.");
            }
        };

        function ejecutarTonoSirenaFisico(frecuencia, duracion) {
            if (!chipSonidoHardware) return;
            try {
                if (chipSonidoHardware.state === 'suspended') chipSonidoHardware.resume();
                const oscilador = chipSonidoHardware.createOscillator();
                const nodoGanancia = chipSonidoHardware.createGain();
                
                oscilador.type = 'sawtooth'; 
                const tiempoActual = chipSonidoHardware.currentTime;
                
                oscilador.frequency.setValueAtTime(frecuencia, tiempoActual);
                oscilador.frequency.linearRampToValueAtTime(frecuencia + 500, tiempoActual + (duracion / 2));
                oscilador.frequency.linearRampToValueAtTime(frecuencia, tiempoActual + duracion);
                
                nodoGanancia.gain.setValueAtTime(0.4, tiempoActual);
                nodoGanancia.gain.exponentialRampToValueAtTime(0.001, tiempoActual + duracion);
                
                oscilador.connect(nodoGanancia);
                nodoGanancia.connect(chipSonidoHardware.destination);
                oscilador.start(tiempoActual);
                oscilador.stop(tiempoActual + duracion);
            } catch (err) {
                console.error(err);
            }
        }

        async function betoltRendelesek() {
            const statuszId = document.getElementById('kapcsolat-statusz');
            const urlEndpoint = `https://${ID_PROYECTO}.supabase.co/rest/v1/rpc/leer_comandas_activas`;

            try {
                const respuesta = await fetch(urlEndpoint, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }
                });

                if (!respuesta.ok) throw new Error("API hiba");
                const rendelések = await respuesta.json();

                if(statuszId) {
                    statuszId.innerText = "Frissítve: " + new Date().toLocaleTimeString();
                    statuszId.style.color = "#3ecf8e";
                }

                if (rendelések.length > utolsoRendelesDarab && utolsoRendelesDarab !== 0) {
                    rendelések.forEach(r => {
                        if (r.id > utolsoRendelesDarab || utolsoRendelesDarab == 0) {
                            alarmasActivasMapeadas.add(Number(r.id));
                        }
                    });
                    arrancarBucleSirenaInfinita();
                }
                utolsoRendelesDarab = rendelések.length;

                const kont = document.getElementById('kont-rendelesek');
                if (!kont) return;

                if (rendelések.length === 0) {
                    kont.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b; font-size: 1.4rem; margin-top: 50px;">Nincs aktív rendelés a konyhán. 🙌</p>`;
                    pararBucleSirena();
                    return;
                }

                let html = '';
                rendelések.forEach(r => {
                    const ido = new Date(r.created_at).toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' });
                    const esRuidoso = alarmasActivasMapeadas.has(Number(r.id)) ? 'szirénázik' : '';
                    
                    html += `
                        <div class="kartya ${esRuidoso}" id="rendeles-${r.id}">
                            <div>
                                <div class="kartya-fejlec">
                                    <span class="id-szam">#${r.id}</span>
                                    <span class="idopont">🕒 ${ido}</span>
                                </div>
                                <div class="cim">📍 ${r.address || 'Nincs cím'}</div>
                                <div class="tetelek">${r.items || 'Üres'}</div>
                                ${r.notes ? `<div class="megjegyzes">💬 Megjegyzés: ${r.notes}</div>` : ''}
                                ${r.total_price ? `<div class="ar-kiiras">💰 Összeg: ${r.total_price} Ft</div>` : ''}
                            </div>
                            <div class="gombok">
                                <button class="btn-nyomtatas" onclick="imprimirDirectoYApagarSirena(${r.id}, '${escapeHtml(r.address || '')}', '${escapeHtml(r.items || '')}', '${escapeHtml(r.notes || '')}')">🖨️ Blokksütés</button>
                                <button class="btn-kesz" onclick="rendelesKesz(${r.id})">✅ Kész</button>
                            </div>
                        </div>
                    `;
                });
                kont.innerHTML = html;

            } catch (err) {
                if(statuszId) {
                    statuszId.innerText = "Csatlakozási hiba.";
                    statuszId.style.color = "red";
                }
            }
        }
        function arrancarBucleSirenaInfinita() {
            if (bucleSirenaEmergencia !== null || !tabletAutorizadaFisicamente) return;
            
            bucleSirenaEmergencia = setInterval(() => {
                if (alarmasActivasMapeadas.size === 0) {
                    pararBucleSirena();
                    return;
                }
                ejecutarTonoSirenaFisico(550, 0.95);
            }, 1000);
        }

        function pararBucleSirena() {
            if (bucleSirenaEmergencia !== null) {
                clearInterval(bucleSirenaEmergencia);
                bucleSirenaEmergencia = null;
            }
        }

        window.rendelesKesz = async function(id) {
            alarmasActivasMapeadas.delete(Number(id));
            if (alarmasActivasMapeadas.size === 0) pararBucleSirena();

            const urlUpdate = `https://${ID_PROYECTO}.supabase.co/rest/v1/comandas?id=eq.${id}`;
            try {
                await fetch(urlUpdate, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                    body: JSON.stringify({ status: 'completed' })
                });
                betoltRendelesek();
            } catch (err) {
                alert("Hiba történt a lezárás során.");
            }
        };

        function escapeHtml(string) {
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/\n/g, '\\n');
        }

        window.imprimirDirectoYApagarSirena = function(id, address, items, notes) {
            alarmasActivasMapeadas.delete(Number(id));
            if (alarmasActivasMapeadas.size === 0) pararBucleSirena();
            
            const tarjetaGrafica = document.getElementById(`rendeles-${id}`);
            if (tarjetaGrafica) tarjetaGrafica.classList.remove('szirénázik');

            const textoPlanoItems = items.replace(/\\n/g, '\n');
            const estructuraTicketRaw = 
                `*** 2NIGHT PIZZA ***\n` +
                `RENDELESI BLOKK\n` +
                `--------------------------------\n` +
                `Rendeles szama: #${id}\n` +
                `Idopont: ${new Date().toLocaleTimeString('hu-HU', {hour: '2-digit', minute:'2-digit'})}\n` +
                `--------------------------------\n` +
                `Cim / Atvetel:\n${address}\n` +
                `--------------------------------\n` +
                `TETELEK:\n${textoPlanoItems}\n` +
                `${notes ? `--------------------------------\nMegjegyzes:\n${notes}\n` : ''}` +
                `--------------------------------\n` +
                `JO ETVAGYAT! JO MUNKAT!\n\n\n\n`;

            const contContenedor = document.getElementById('nyomtatas-terulet-escondido');
            if (contContenedor) {
                contContenedor.innerHTML = `<iframe id="pasarela-impresion-silenciosa" src="about:blank"></iframe>`;
                const iframeElemento = document.getElementById('pasarela-impresion-silenciosa');
                const docIframe = iframeElemento.contentWindow.document;
                
                docIframe.open();
                // Tipografía gigante y en negrita configurada a 22px para la ticketera
                docIframe.write(`<pre style="font-family:monospace; font-size:22px; font-weight:bold; color:black; margin:0; padding:5px; line-height:1.4;">${estructuraTicketRaw}</pre>`);
                docIframe.close();

                setTimeout(() => {
                    iframeElemento.contentWindow.focus();
                    iframeElemento.contentWindow.print();
                }, 200);
            }
        };

        betoltRendelesek();
        setInterval(betoltRendelesek, 4000);
    </script>
</body>
</html>
