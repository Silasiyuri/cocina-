   <!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2NIGHT - Konyhai Panel (Automata Nyomtatás)</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; color: #3ecf8e; font-size: 1.8rem; display: flex; align-items: center; gap: 15px; }
        .grid-rendelesek { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .kartya { background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .kartya-fejlec { display: flex; justify-content: space-between; border-bottom: 1px dashed #475569; padding-bottom: 8px; margin-bottom: 10px; }
        .id-szam { font-weight: bold; color: #cbd5e1; font-size: 1.2rem; }
        .idopont { color: #94a3b8; font-size: 0.85rem; }
        .cim { font-weight: bold; color: #d6af37; margin-bottom: 10px; font-size: 1rem; }
        .tetelek { white-space: pre-wrap; font-size: 1.1rem; background: #0f172a; padding: 10px; border-radius: 4px; border-left: 3px solid #3ecf8e; margin-bottom: 10px; color: #fff; }
        .megjegyzes { font-style: italic; color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px; }
        
        .kartya.szirénázik { border: 2px solid #ef4444; animation: riasztoKartya 1s infinite alternate; }
        @keyframes riasztoKartya {
            0% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.2); background: #1e293b; }
            100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); background: #2d1e24; }
        }

        .gombok { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-nyomtatas { background: #3b82f6; color: white; }
        .btn-kesz { background: #3ecf8e; color: white; }
        
        .btn-audio-unblock { background: #eab308; color: #000; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; border: none; }
        .btn-audio-unblock.active { background: #3ecf8e; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>
            👨‍🍳 Konyhai Monitor 
            <button id="btnAudioDesbloqueo" class="btn-audio-unblock" onclick="desbloquearSonido()">🔔 HANG AKTIVÁLÁSA</button>
        </h1>
        <div id="kapcsolat-statusz" style="color: #64748b;">Kapcsolódás...</div>
    </header>

    <audio id="audio-riaszto" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==" preload="auto"></audio>

    <div class="grid-rendelesek" id="kont-rendelesek"></div>
    <script>
        const ID_PROYECTO = "kpxcpkzmquqyduadnahz";
        const SUPABASE_KEY = "sb_publishable_XMm1hlrSBzm8iyLWM1iqCA__qBE79B3";
        let utolsoRendelesDarab = 0;
        let audioContextNativo = null;
        
        let bucleAlarmaSonora = null;
        let alarmasActivasMapeadas = new Set(); 
        let interactuadoFisicamente = false;

        window.desbloquearSonido = function() {
            const btn = document.getElementById('btnAudioDesbloqueo');
            interactuadoFisicamente = true;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContextNativo = new AudioContext();
                if (audioContextNativo.state === 'suspended') audioContextNativo.resume();
                forzarSirenaMovil(0.1);
                if (btn) {
                    btn.innerText = "🟢 MONITOR RENDIKBEN";
                    btn.className = "btn-audio-unblock active";
                }
            } catch (e) {
                alert("Hiba a hangmotor indításakor.");
            }
        };

        function forzarSirenaMovil(duracion) {
            if (!audioContextNativo) return;
            try {
                if (audioContextNativo.state === 'suspended') audioContextNativo.resume();
                const oscilador = audioContextNativo.createOscillator();
                const ganancia = audioContextNativo.createGain();
                oscilador.type = 'sawtooth'; 
                const tiempoActual = audioContextNativo.currentTime;
                
                oscilador.frequency.setValueAtTime(550, tiempoActual);
                oscilador.frequency.linearRampToValueAtTime(1050, tiempoActual + 0.25);
                oscilador.frequency.linearRampToValueAtTime(550, tiempoActual + 0.5);
                oscilador.frequency.linearRampToValueAtTime(1050, tiempoActual + 0.75);
                oscilador.frequency.linearRampToValueAtTime(550, tiempoActual + 1.0);
                
                ganancia.gain.setValueAtTime(0.4, tiempoActual);
                ganancia.gain.linearRampToValueAtTime(0.4, tiempoActual + duracion - 0.05);
                ganancia.gain.exponentialRampToValueAtTime(0.001, tiempoActual + duracion);
                
                oscilador.connect(ganancia);
                ganancia.connect(audioContextNativo.destination);
                oscilador.start(tiempoActual);
                oscilador.stop(tiempoActual + duracion);
            } catch (err) {
                console.error(err);
            }
        }
        async function betoltRendelesek() {
            const statuszId = document.getElementById('kapcsolat-statusz');
            const urlEndpoint = `https://${ID_PROYECTO}.supabase.co/rest/v1/rpc/leer_comandas_activas`;

            try {
                const respuesta = await fetch(urlEndpoint, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }
                });

                if (!respuesta.ok) throw new Error("API hiba");
                const rendelések = await respuesta.json();

                if(statuszId) {
                    statuszId.innerText = "Frissítve: " + new Date().toLocaleTimeString();
                    statuszId.style.color = "#3ecf8e";
                }

                if (rendelések.length > utolsoRendelesDarab && utolsoRendelesDarab !== 0) {
                    rendelések.forEach(r => {
                        if (r.id > utolsoRendelesDarab || utolsoRendelesDarab == 0) {
                            alarmasActivasMapeadas.add(Number(r.id));
                        }
                    });
                    arrancarBucleDeTimbreContinuo();
                }
                utolsoRendelesDarab = rendelések.length;

                const kont = document.getElementById('kont-rendelesek');
                if (!kont) return;

                if (rendelések.length === 0) {
                    kont.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b; font-size: 1.2rem; margin-top: 50px;">Nincs aktív rendelés a konyhán. 🙌</p>`;
                    pararBucleDeTimbreCompleto();
                    return;
                }

                let html = '';
                rendelések.forEach(r => {
                    const ido = new Date(r.created_at).toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' });
                    const esRuidoso = alarmasActivasMapeadas.has(Number(r.id)) ? 'szirénázik' : '';
                    
                    html += `
                        <div class="kartya ${esRuidoso}" id="rendeles-${r.id}">
                            <div>
                                <div class="kartya-fejlec">
                                    <span class="id-szam">#${r.id}</span>
                                    <span class="idopont">🕒 ${ido}</span>
                                </div>
                                <div class="cim">📍 ${r.address || 'Nincs cím'}</div>
                                <div class="tetelek">${r.items || 'Üres'}</div>
                                ${r.notes ? `<div class="megjegyzes">💬 Megjegyzés: ${r.notes}</div>` : ''}
                                ${r.total_price ? `<div style="color:#d6af37; font-weight:bold; margin-top:5px;">💰 Összeg: ${r.total_price} Ft</div>` : ''}
                            </div>
                            <div class="gombok">
                                <button class="btn-nyomtatas" onclick="automatizaltNyomtatasBypass(${r.id}, '${escapeHtml(r.address || '')}', '${escapeHtml(r.items || '')}', '${escapeHtml(r.notes || '')}')">🖨️ Blokksütés</button>
                                <button class="btn-kesz" onclick="rendelesKesz(${r.id})">✅ Kész</button>
                            </div>
                        </div>
                    `;
                });
                kont.innerHTML = html;

            } catch (err) {
                if(statuszId) {
                    statuszId.innerText = "Csatlakozási hiba.";
                    statuszId.style.color = "red";
                }
            }
        }
        function arrancarBucleDeTimbreContinuo() {
            if (bucleAlarmaSonora !== null || !interactuadoFisicamente) return;
            bucleAlarmaSonora = setInterval(() => {
                if (alarmasActivasMapeadas.size === 0) {
                    pararBucleDeTimbreCompleto();
                    return;
                }
                forzarSirenaMovil(1.0);
            }, 1050);
        }

        function pararBucleDeTimbreCompleto() {
            if (bucleAlarmaSonora !== null) {
                clearInterval(bucleAlarmaSonora);
                bucleAlarmaSonora = null;
            }
        }

        window.rendelesKesz = async function(id) {
            alarmasActivasMapeadas.delete(Number(id));
            if (alarmasActivasMapeadas.size === 0) pararBucleDeTimbreCompleto();

            const urlUpdate = `https://${ID_PROYECTO}.supabase.co/rest/v1/comandas?id=eq.${id}`;
            try {
                await fetch(urlUpdate, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                    body: JSON.stringify({ status: 'completed' })
                });
                betoltRendelesek();
            } catch (err) {
                alert("Hiba történt a lezárás során.");
            }
        };

        function escapeHtml(string) {
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/\n/g, '\\n');
        }

        window.automatizaltNyomtatasBypass = function(id, address, items, notes) {
            alarmasActivasMapeadas.delete(Number(id));
            if (alarmasActivasMapeadas.size === 0) pararBucleDeTimbreCompleto();
            const tarjetaGrafica = document.getElementById(`rendeles-${id}`);
            if (tarjetaGrafica) tarjetaGrafica.classList.remove('szirénázik');

            const textoLimpioItems = items.replace(/\\n/g, '\n');

            const contenidoTicketRaw = 
                `*** 2NIGHT PIZZA ***\n` +
                `RENDELESI BLOKK\n` +
                `--------------------------------\n` +
                `Rendeles szama: #${id}\n` +
                `Idopont: ${new Date().toLocaleTimeString('hu-HU', {hour: '2-digit', minute:'2-digit'})}\n` +
                `--------------------------------\n` +
                `Cim / Atvetel:\n${address}\n` +
                `--------------------------------\n` +
                `TETELEK:\n${textoLimpioItems}\n` +
                `${notes ? `--------------------------------\nMegjegyzes:\n${notes}\n` : ''}` +
                `--------------------------------\n` +
                `JO ETVAGYAT! JO MUNKAT!\n\n\n\n`;

            const blobTicket = new Blob([contenidoTicketRaw], { type: 'text/plain;charset=utf-8' });
            const urlIframeImpresion = URL.createObjectURL(blobTicket);
            
            const constructorCanal = document.createElement('iframe');
            constructorCanal.style.position = 'fixed';
            constructorCanal.style.right = '0';
            constructorCanal.style.bottom = '0';
            constructorCanal.style.width = '0';
            constructorCanal.style.height = '0';
            constructorCanal.style.border = '0';
            constructorCanal.src = urlIframeImpresion;
            
            document.body.appendChild(constructorCanal);
            
            constructorCanal.contentWindow.addEventListener('DOMContentLoaded', () => {
                constructorCanal.contentWindow.focus();
                constructorCanal.contentWindow.print();
                setTimeout(() => document.body.removeChild(constructorCanal), 1000);
            });
        };

        betoltRendelesek();
        setInterval(betoltRendelesek, 4000);
    </script>
</body>
</html>
